services:
  mcontrolprogram:
    build: .
    restart: unless-stopped
    user: "1000:1000" # match the owner of ./data
    ports:
      - "7700:7700"      # admin UI
      - "7801:7801"      # MCP servers: add one line per server port you create
    volumes:
      - ./data:/data:z
      - ./test/fixtures:/app/fixtures:ro,z # lets the mcp plugin run the echo test server: node /app/fixtures/echo-mcp.mjs
      # Docker Sandboxes plugin, native host (sbx on this Docker host; set the host's sbx binary to `env HOME=/home/you sbx`).
      # Same paths as on the host; the host user must be uid 1000 like this container. Mount workspace roots at their host paths too.
      # - /usr/bin/sbx:/usr/bin/sbx:ro
      # - /home/you/.local/state/sandboxes:/home/you/.local/state/sandboxes
      # - /home/you/.sbx:/home/you/.sbx
      # - /home/you/.docker:/home/you/.docker:ro
      # - /home/you/.config/sandboxes:/home/you/.config/sandboxes
      # - /home/you/.config/com.docker.sandboxes:/home/you/.config/com.docker.sandboxes
    environment:
      # Optional. If unset, /data/master.key is generated on first run; keep it with the DB.
      # MCONTROLPROGRAM_MASTER_KEY:
      # MCONTROLPROGRAM_PUBLIC_URL: https://mcontrolprogram.example.com
      MCONTROLPROGRAM_ADMIN_HOST: 0.0.0.0

